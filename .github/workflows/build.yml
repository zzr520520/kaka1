name: Build KakaVoicePro

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare iOS SDK
        run: |
          set -euo pipefail
          ls -la
          test -f KakaVoicePro.m || { echo "::error::缺少 KakaVoicePro.m"; exit 1; }
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "using sdk: $SDK"

      - name: Build (clang 交叉编译，对应 build.sh)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 -I. \
            -o KakaVoicePro_v34.0.dylib \
            KakaVoicePro.m tweetnacl.c fishhook.c \
            -framework UIKit \
            -framework Foundation \
            -framework AudioToolbox \
            -framework Security \
            -framework CoreGraphics \
            -framework QuartzCore \
            -Wl,-arch,arm64 \
            -Wl,-platform_version,ios,14.0,15.6 \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Inspect output
        if: always()
        run: |
          ls -l *.dylib || true
          file *.dylib || true
          shasum -a 256 *.dylib || true

      - name: Package zip
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          zip -j KakaVoicePro_v34.0.zip KakaVoicePro_v34.0.dylib README.txt
          unzip -l KakaVoicePro_v34.0.zip
          shasum -a 256 KakaVoicePro_v34.0.zip

      - name: Upload dylib
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KakaVoicePro-dylib
          path: KakaVoicePro_v34.0.dylib

      - name: Upload zip
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KakaVoicePro-zip
          path: KakaVoicePro_v34.0.zip

      - name: Publish build log
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "kaka-ci-bot"
          git config user.email "kaka-ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          cp "$RUNNER_TEMP/build.log" build.log
          git add -f build.log
          git commit -m "ci: build log (run ${{ github.run_number }})"
          git push -f origin ci-logs

      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
